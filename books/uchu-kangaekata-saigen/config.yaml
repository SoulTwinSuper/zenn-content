title: "宇宙を考える技法　再現編：公開データで確かめ、整理して書く"
summary: |
  片倉慶孝 著、計算・文章の補助: AI（Claude）。
  新しい理論や予言を主張しない論文（入門・再現・整理ノート）の書き方を、
  Paper IN-01・IN-02・DB-01・NS-01 の制作過程を題材に学ぶ。
  公開データと公開論文だけで、自分の手で確かめ、確認の深さを印で示し、
  反論を併記し、間違えた記録も隠さずに見せる。
  『実践編-1』（予言を持つ理論論文）と対になる、整理型の論文の技法。
